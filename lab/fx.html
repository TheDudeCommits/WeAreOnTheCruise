<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FX lab — We Are On The Cruise</title>
    <style>
      html, body { margin: 0; height: 100%; background: #06283f; overflow: hidden; font: 12px/1.35 system-ui, sans-serif; color: #fff3d4; }
      #root { position: fixed; inset: 0; }
      #root canvas { display: block; width: 100%; height: 100%; }
      #panel { position: fixed; top: 8px; left: 8px; bottom: 8px; width: 300px; overflow-y: auto; background: rgba(6, 22, 40, 0.82);
        border: 1px solid rgba(255, 215, 106, 0.35); border-radius: 8px; padding: 8px 10px; z-index: 10; }
      #panel h1 { font-size: 14px; margin: 0 0 6px; color: #ffd76a; letter-spacing: 0.04em; }
      #panel h2 { font-size: 11px; margin: 10px 0 4px; color: #9fd8ff; text-transform: uppercase; letter-spacing: 0.08em; }
      #panel button { background: #12324f; color: #fff3d4; border: 1px solid #2b5a80; border-radius: 4px; padding: 3px 6px; margin: 2px 1px;
        cursor: pointer; font: 11px system-ui, sans-serif; }
      #panel button:hover { background: #1c4a72; }
      #panel button.on { background: #ffd76a; color: #06283f; }
      #stats { position: fixed; right: 8px; top: 8px; background: rgba(6, 22, 40, 0.82); padding: 6px 10px; border-radius: 6px;
        font: 12px ui-monospace, Menlo, monospace; white-space: pre; z-index: 10; border: 1px solid rgba(159, 216, 255, 0.35); }
      body.clean #panel, body.clean #stats { display: none; }
      #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 5; mix-blend-mode: screen; }
      #lines { position: fixed; inset: 0; pointer-events: none; z-index: 6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="flash"></div>
    <canvas id="lines"></canvas>
    <div id="panel"><h1>FX LAB · sakuga kit</h1></div>
    <div id="stats"></div>
    <script type="module" src="/src/render/fx/lab/main.ts"></script>
  </body>
</html>

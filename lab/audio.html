<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio lab — We Are On The Cruise</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; --bg: #071f33; --panel: #0d2c47; --line: #1d4a6e; --ink: #f3ead3; --dim: #9fb9c9; --gold: #ffd272; --red: #ff7a6b; --teal: #6fe0c8; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      header { position: sticky; top: 0; z-index: 5; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: #04182a; border-bottom: 1px solid var(--line); }
      header h1 { margin: 0; font-size: 16px; letter-spacing: .04em; color: var(--gold); }
      main { display: grid; grid-template-columns: 360px 1fr; gap: 12px; padding: 12px 16px 40px; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
      section h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
      button { background: #173e5f; color: var(--ink); border: 1px solid #2a6189; border-radius: 5px; padding: 5px 8px; font: inherit; cursor: pointer; }
      button:hover { background: #20507a; }
      button.primary { background: var(--gold); color: #06283f; border-color: var(--gold); font-weight: 700; }
      button.active { outline: 2px solid var(--teal); }
      button.flash { background: #2f7d63; }
      label.row { display: grid; grid-template-columns: 96px 1fr 52px; gap: 8px; align-items: center; margin: 4px 0; }
      label.row output { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
      input[type=range] { width: 100%; }
      .cues { display: flex; flex-wrap: wrap; gap: 5px; }
      .cat { margin: 8px 0 4px; color: var(--gold); font-weight: 600; font-size: 12px; }
      .cues button small { color: var(--dim); margin-left: 3px; }
      table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      td, th { padding: 2px 6px; border-bottom: 1px solid #16405f; text-align: left; }
      th { color: var(--dim); font-weight: 500; }
      .bar { height: 8px; background: #0a2239; border-radius: 4px; overflow: hidden; }
      .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold), var(--red)); }
      pre { margin: 0; white-space: pre-wrap; font: 11px/1.35 ui-monospace, Menlo, monospace; color: var(--dim); max-height: 220px; overflow: auto; }
      .pill { padding: 2px 8px; border-radius: 10px; background: #173e5f; color: var(--dim); }
      .pill.ok { background: #1e5b48; color: #d4fff2; }
      #pad { width: 100%; aspect-ratio: 1; background: radial-gradient(circle, #123a5a 0 2px, transparent 3px) center/100% 100%, #0a2239; border-radius: 8px; position: relative; cursor: crosshair; }
      #pad .dot { position: absolute; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--gold); }
      #pad .ship { position: absolute; left: 50%; top: 50%; width: 8px; height: 18px; margin: -9px -4px; background: var(--teal); border-radius: 4px 4px 2px 2px; }
      #pad .ring { position: absolute; border: 1px dashed #2a6189; border-radius: 50%; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="lab"></div>
    <script type="module" src="/src/audio/lab/audioLab.ts"></script>
  </body>
</html>

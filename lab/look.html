<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>We Are On The Cruise — LOOK lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #06283f; overflow: hidden; font: 12px/1.35 system-ui, sans-serif; color: #eef4f8; }
      #lab-root { position: fixed; inset: 0; }
      #lab-root canvas { display: block; width: 100%; height: 100%; }
      #lab-panel { position: fixed; top: 10px; right: 10px; width: 250px; padding: 10px; display: grid; gap: 6px;
        background: rgba(8, 18, 38, 0.78); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; }
      #lab-panel label { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      #lab-panel input[type=range] { width: 150px; }
      #lab-panel button { margin: 2px; padding: 3px 7px; border: 0; border-radius: 4px; background: #ffd272; color: #06283f; font-weight: 600; cursor: pointer; }
      #lab-stats { position: fixed; left: 10px; bottom: 10px; padding: 4px 8px; background: rgba(8, 18, 38, 0.7); border-radius: 4px; font-variant-numeric: tabular-nums; }
      body[data-ui="0"] #lab-stats { display: none; }
    </style>
  </head>
  <body>
    <div id="lab-root"></div>
    <div id="lab-panel"><strong>LOOK lab — cel, ink, sky, post</strong></div>
    <div id="lab-stats"></div>
    <script>if (new URLSearchParams(location.search).get('ui') === '0') document.body.dataset.ui = '0';</script>
    <script type="module" src="/src/render/app/lab/look.ts"></script>
  </body>
</html>

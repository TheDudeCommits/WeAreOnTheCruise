<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <!-- left half: Redtide red canvas with the cutlass-and-sun; right half: plain red canvas -->
  <rect width="1024" height="512" fill="#b3201e"/>
  <g stroke="#9a1a19" stroke-width="6">
    <line x1="64" y1="0" x2="64" y2="512"/><line x1="160" y1="0" x2="160" y2="512"/><line x1="352" y1="0" x2="352" y2="512"/><line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="576" y1="0" x2="576" y2="512"/><line x1="704" y1="0" x2="704" y2="512"/><line x1="832" y1="0" x2="832" y2="512"/><line x1="960" y1="0" x2="960" y2="512"/>
  </g>
  <rect x="0" y="0" width="512" height="512" fill="none" stroke="#5a0c0c" stroke-width="10"/>
  <rect x="512" y="0" width="512" height="512" fill="none" stroke="#5a0c0c" stroke-width="10"/>
  <g transform="translate(256 258)">
    <!-- black sun with rays -->
    <g fill="#16110f">
      <circle r="88"/>
      <g id="ray"><path d="M -18 -96 L 0 -168 L 18 -96 Z"/></g>
      <use href="#ray" transform="rotate(30)"/><use href="#ray" transform="rotate(60)"/><use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(120)"/><use href="#ray" transform="rotate(150)"/><use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(210)"/><use href="#ray" transform="rotate(240)"/><use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(300)"/><use href="#ray" transform="rotate(330)"/>
    </g>
    <!-- cutlass across the sun -->
    <g transform="rotate(-38)">
      <path d="M -150 -12 C -60 -40 60 -40 150 -8 C 70 6 -40 12 -140 18 Z" fill="#efe6d2" stroke="#16110f" stroke-width="9" stroke-linejoin="round"/>
      <rect x="-196" y="-14" width="48" height="30" rx="6" fill="#d8a23a" stroke="#16110f" stroke-width="8"/>
      <path d="M -150 -40 C -176 -40 -176 44 -150 44" fill="none" stroke="#d8a23a" stroke-width="12"/>
    </g>
  </g>
</svg>
